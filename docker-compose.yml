services:
  web:
    build: .
    container_name: 3dprint_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ADMIN_USER: admin
      APP_ADMIN_PASSWORD: admin123
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: 3dprint_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: printtracker
      POSTGRES_USER: printuser
      POSTGRES_PASSWORD: printpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  adminer:
    image: adminer:latest
    container_name: 3dprint_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
