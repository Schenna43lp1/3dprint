name: Deploy – Staging → Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

# ─────────────────────────────────────────────
# REQUIRED GITHUB SECRETS (Settings → Secrets):
#
#   SSH_HOST_STAGING      IP / hostname of staging server
#   SSH_HOST_PRODUCTION   IP / hostname of production server
#   SSH_USER              SSH username (e.g. deploy)
#   SSH_PRIVATE_KEY       Private key (RSA/ED25519), full content
#   SSH_PORT              SSH port (optional – default 22)
#   DEPLOY_PATH           Absolute path on server (e.g. /var/www/3dprint)
#
# REQUIRED GITHUB ENVIRONMENTS (Settings → Environments):
#   staging    – no protection rules (auto-deploy)
#   production – add "Required reviewers" for manual gate
# ─────────────────────────────────────────────

jobs:
  # ── 1. Build & push Docker image to GHCR ───
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to STAGING ────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Logging in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Pulling new image"
            docker compose pull web

            echo "==> Restarting containers (zero-downtime)"
            docker compose up -d --remove-orphans

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Health check"
            sleep 5
            curl -fsS --retry 3 --retry-delay 3 \
              http://localhost:8080/ > /dev/null \
              && echo "Staging OK" \
              || (echo "Health check FAILED" && exit 1)

      - name: Notify staging deployed
        run: |
          echo "### ✅ Staging deployed" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository }}:staging\`" >> $GITHUB_STEP_SUMMARY

  # ── 3. Deploy to PRODUCTION (manual gate) ──
  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Logging in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Pulling new image (tag: sha-${{ github.sha }})"
            IMAGE=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            docker pull "$IMAGE"

            echo "==> Tagging as latest"
            docker tag "$IMAGE" ghcr.io/${{ github.repository }}:latest

            echo "==> Restarting containers"
            docker compose up -d --remove-orphans

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Health check"
            sleep 5
            curl -fsS --retry 3 --retry-delay 3 \
              http://localhost:8080/ > /dev/null \
              && echo "Production OK" \
              || (echo "Health check FAILED" && exit 1)

      - name: Notify production deployed
        run: |
          echo "### 🚀 Production deployed" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
