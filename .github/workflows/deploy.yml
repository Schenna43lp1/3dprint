name: Deploy

on:
  push:
    branches: [main]

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            docker pull $IMAGE:${{ github.sha }}
            docker stop 3dprint-staging || true
            docker rm   3dprint-staging || true
            docker ps -q --filter "publish=8180" | xargs -r docker stop
            docker ps -aq --filter "publish=8180" | xargs -r docker rm
            docker run -d --name 3dprint-staging \
              --restart unless-stopped \
              -p 8180:80 \
              -v 3dprint_staging_uploads:/var/www/html/uploads \
              $IMAGE:${{ github.sha }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            docker stop 3dprint-production || true
            docker rm   3dprint-production || true
            docker ps -q --filter "publish=80" | xargs -r docker stop
            docker ps -aq --filter "publish=80" | xargs -r docker rm
            docker run -d --name 3dprint-production \
              --restart unless-stopped \
              -p 80:80 \
              -v 3dprint_prod_uploads:/var/www/html/uploads \
              $IMAGE:${{ github.sha }}
